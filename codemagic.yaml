workflows:
  ios-release:
    name: iOS Release Build
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter packages
        script: |
          flutter packages pub get
      - name: Flutter configuration
        script: |
          flutter build ios --config-only --no-codesign
      - name: Install CocoaPods
        script: |
          cd ios && pod install
      - name: Flutter build iOS
        script: |
          flutter build ios --release --no-codesign
      - name: Package iOS App
        script: |
          mkdir -p build/ios/ipa
          cd build/ios/iphoneos
          mkdir Payload
          cp -r Runner.app Payload
          zip -r ../ipa/RideShare-iOS.ipa Payload
    artifacts:
      - build/ios/ipa/RideShare-iOS.ipa
    publishing:
      email:
        recipients:
          - rideshare8855@gmail.com

  web-release:
    name: Web Release Build
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      flutter: stable
    scripts:
      - name: Get Flutter packages
        script: |
          flutter packages pub get
      - name: Flutter build Web
        script: |
          flutter build web --release
      - name: Package Web Build
        script: |
          cd build/web
          zip -r ../../web-build.zip .
    artifacts:
      - web-build.zip
    publishing:
      email:
        recipients:
          - rideshare8855@gmail.com
